<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zimmerplanung Hof Wigger</title>
<style>
  :root {
    --bg: #f4f5f2;
    --card: #ffffff;
    --text: #222;
    --muted: #666;
    --wall: #1f4f9c;
    --accent: #2e8b6e;
    --red: #c62828;
    --free: #ffffff;
    --part: #fff6d6;
    --full: #dcefe6;
    --over: #fbdcdc;
    --sel: #ffe082;
    --flur: #f7f7f7;
    --border: #d5d8d0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
  }
  header h1 { margin: 0; font-size: 20px; color: var(--accent); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; flex: 1; }
  .meta label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
  .meta input { font: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; min-width: 0; }
  .meta input#gruppe { width: 240px; max-width: 100%; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; }
  button, .btn {
    font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: #fff; color: var(--text);
  }
  button:hover, .btn:hover { background: #eef2ec; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: #26745c; }
  button.danger { color: var(--red); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 16px; }

  svg#plan { width: 100%; height: auto; display: block; }
  .room rect.box { stroke: var(--wall); stroke-width: 4; }
  .room.edit { cursor: pointer; }
  .room.edit:hover rect.box { fill: #eef6ff; }
  .room.selected rect.box { fill: var(--sel) !important; }
  .room .title { font-weight: 700; font-size: 13px; fill: var(--wall); }
  .room .count { font-size: 12px; fill: var(--muted); font-weight: 600; }
  .room .name { font-size: 12px; fill: #222; }
  .room .name.dup { fill: var(--red); font-weight: 700; }
  .room .more { font-size: 11px; fill: var(--muted); font-style: italic; }
  .room .info { font-size: 12px; fill: #444; }
  .flur rect { fill: var(--flur); stroke: none; }
  .flurtext { font-size: 13px; fill: #888; }

  #editor .leer { color: var(--muted); }
  #editor label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 3px; }
  #editor input, #editor textarea {
    width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
  }
  #editor textarea#namen { min-height: 190px; resize: vertical; }
  #editor textarea#notiz { min-height: 60px; resize: vertical; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .warn { color: var(--red); font-size: 13px; margin-top: 6px; }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span:not(.savestate)::before { content: ""; display: inline-block; width: 12px; height: 12px; border: 1px solid #999; margin-right: 5px; vertical-align: -2px; background: var(--c); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.namen { white-space: pre-line; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #f3f7f1; }
  .summe { margin-top: 8px; font-weight: 600; }
  #liste { grid-column: 1 / -1; }
  .printhead { display: none; }
  .savestate { font-size: 12px; color: var(--muted); }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    body { background: #fff; font-size: 12px; }
    header, #editor, .toolbar, .legend, .noprint { display: none !important; }
    main { display: block; padding: 0; max-width: none; }
    .card { border: none; padding: 0; border-radius: 0; }
    .printhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4mm; }
    .printhead h1 { font-size: 18px; margin: 0; color: #000; }
    .printhead div { font-size: 13px; }
    #planwrap { page-break-after: always; break-after: page; }
    svg#plan { max-height: 175mm; width: auto; max-width: 100%; margin: 0 auto; }
    .room rect.box { fill: #fff !important; }
    .room.selected rect.box { fill: #fff !important; }
    .flur rect { fill: #fff; }
    tr { break-inside: avoid; }
    th, td { border-bottom: 1px solid #999; }
  }
</style>
</head>
<body>

<header>
  <h1>Zimmerplanung</h1>
  <div class="meta">
    <label>Gruppe / Belegung<input id="gruppe" type="text" placeholder="z.B. Klasse 4b, Grundschule ..."></label>
    <label>Anreise<input id="von" type="date"></label>
    <label>Abreise<input id="bis" type="date"></label>
  </div>
  <div class="toolbar">
    <button class="primary" onclick="window.print()">Drucken</button>
    <button onclick="exportJSON()">Sichern (Datei)</button>
    <button onclick="document.getElementById('importfile').click()">Laden (Datei)</button>
    <input id="importfile" type="file" accept=".json,application/json" hidden>
    <button class="danger" onclick="resetAll()">Alles leeren</button>
  </div>
</header>

<main>
  <section class="card" id="planwrap">
    <div class="printhead">
      <h1 id="p-titel">Lageplan Zimmer</h1>
      <div id="p-zeit"></div>
    </div>
    <svg id="plan" viewBox="-10 -10 880 500" xmlns="http://www.w3.org/2000/svg" aria-label="Lageplan Zimmer"></svg>
    <div class="legend">
      <span style="--c: var(--free)">leer</span>
      <span style="--c: var(--part)">teilweise belegt</span>
      <span style="--c: var(--full)">voll</span>
      <span style="--c: var(--over)">überbelegt</span>
      <span style="--c: var(--sel)">ausgewählt</span>
      <span class="savestate" id="savestate"></span>
    </div>
  </section>

  <aside class="card" id="editor"></aside>

  <section class="card" id="liste">
    <h2>Belegungsliste</h2>
    <table>
      <thead><tr><th>Zimmer</th><th>Betten</th><th>Belegt</th><th>Namen</th><th>Notiz</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="summe" id="summe"></div>
  </section>
</main>

<script>
const STORAGE_KEY = 'hofwigger-zimmerplanung-v1';

// Grundriss (vereinfacht nach Lageplan). Koordinaten im SVG-viewBox.
const ROOMS = [
  { id: 'z3', label: 'Zimmer 3',   x: 0,   y: 0,   w: 135, h: 220 },
  { id: 'z4', label: 'Zimmer 4',   x: 135, y: 0,   w: 135, h: 180 },
  { id: 'b5', label: 'Betreuer 5', x: 270, y: 0,   w: 95,  h: 180 },
  { id: 'b6', label: 'Betreuer 6', x: 365, y: 0,   w: 90,  h: 195 },
  { id: 'z2', label: 'Zimmer 2',   x: 0,   y: 220, w: 140, h: 220 },
  { id: 'z1', label: 'Zimmer 1',   x: 140, y: 260, w: 150, h: 180 },
  { id: 'z9', label: 'Zimmer 9',   x: 330, y: 295, w: 125, h: 145 },
  { id: 'z7', label: 'Zimmer 7',   x: 680, y: 185, w: 180, h: 140 },
  { id: 'z8', label: 'Zimmer 8',   x: 680, y: 325, w: 180, h: 130 },
];
const FIXED = [
  { label: '',                   x: 455, y: 5,   w: 100, h: 60 },
  { label: 'Dusche/WC\nDamen',   x: 455, y: 65,  w: 100, h: 115 },
  { label: 'Dusche/WC\nHerren',  x: 555, y: 5,   w: 80,  h: 165 },
  { label: 'Putzraum',           x: 455, y: 280, w: 135, h: 175 },
  { label: '',                   x: 590, y: 380, w: 90,  h: 75 },
];
const FLURE = [
  { x: 0, y: 180, w: 455, h: 115 },
  { x: 455, y: 170, w: 225, h: 285 },
];

let state = emptyState();
let selected = null;

function emptyState() {
  const rooms = {};
  ROOMS.forEach(r => rooms[r.id] = { betten: '', namen: [], notiz: '' });
  return { meta: { gruppe: '', von: '', bis: '' }, rooms };
}

// ---------- Speicherung ----------
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = normalize(JSON.parse(raw));
  } catch (e) { console.warn('Laden fehlgeschlagen', e); }
}
function normalize(data) {
  const s = emptyState();
  if (data && data.meta) Object.assign(s.meta, data.meta);
  if (data && data.rooms) {
    ROOMS.forEach(r => {
      const d = data.rooms[r.id];
      if (d) s.rooms[r.id] = {
        betten: d.betten ?? '',
        namen: Array.isArray(d.namen) ? d.namen.map(String) : [],
        notiz: d.notiz ?? ''
      };
    });
  }
  return s;
}
let saveTimer;
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const t = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('savestate').textContent = 'gespeichert ' + t;
  } catch (e) {
    document.getElementById('savestate').textContent = 'Speichern im Browser nicht möglich, bitte "Sichern (Datei)" nutzen';
  }
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }

function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const name = (state.meta.gruppe || 'zimmerplanung').replace(/[^\wäöüÄÖÜß-]+/g, '_');
  a.href = URL.createObjectURL(blob);
  a.download = name + (state.meta.von ? '_' + state.meta.von : '') + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('importfile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      if (!confirm('Aktuelle Planung durch Datei ersetzen?')) return;
      state = normalize(data);
      selected = null;
      save(); renderAll();
    } catch (err) { alert('Datei konnte nicht gelesen werden.'); }
  };
  rd.readAsText(f);
  e.target.value = '';
});
function resetAll() {
  if (!confirm('Wirklich alle Einträge löschen? Vorher ggf. "Sichern (Datei)".')) return;
  state = emptyState(); selected = null; save(); renderAll();
}

// ---------- Hilfen ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function duplicates() {
  const seen = {}, dup = new Set();
  ROOMS.forEach(r => state.rooms[r.id].namen.forEach(n => {
    const k = n.trim().toLowerCase();
    if (!k) return;
    if (seen[k]) dup.add(k); else seen[k] = true;
  }));
  return dup;
}
function status(id) {
  const d = state.rooms[id], n = d.namen.length, b = parseInt(d.betten, 10);
  if (!n) return 'free';
  if (!b) return 'part';
  if (n > b) return 'over';
  if (n === b) return 'full';
  return 'part';
}
const FILL = { free: 'var(--free)', part: 'var(--part)', full: 'var(--full)', over: 'var(--over)' };
function fmtDate(d) { if (!d) return ''; const [y, m, t] = d.split('-'); return `${t}.${m}.${y}`; }
function cut(text, maxChars) { return text.length > maxChars ? text.slice(0, Math.max(1, maxChars - 1)) + '…' : text; }

// ---------- Plan ----------
function renderPlan() {
  const dup = duplicates();
  let s = '';
  s += '<g class="flur">' + FLURE.map(f => `<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}"/>`).join('') + '</g>';
  s += '<text class="flurtext" x="200" y="243">Flur</text><text class="flurtext" x="560" y="240">Flur</text>';
  // Treppe
  s += '<g>';
  for (let y = 262; y < 440; y += 10) s += `<line x1="292" x2="328" y1="${y}" y2="${y}" stroke="#2e8b6e" stroke-width="2"/>`;
  s += '<rect x="290" y="260" width="40" height="180" fill="none" stroke="#2e8b6e" stroke-width="2"/></g>';
  // Eingang
  s += '<path d="M310 480 L310 448 M302 456 L310 446 L318 456" stroke="#e0b52b" stroke-width="5" fill="none"/>';
  s += '<text x="322" y="476" font-size="12" fill="#666">Eingang</text>';
  // Nebenräume
  FIXED.forEach(f => {
    s += `<g class="room"><rect class="box" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" fill="#fafafa"/>`;
    if (f.label) f.label.split('\n').forEach((l, i) => s += `<text class="info" x="${f.x + f.w / 2}" y="${f.y + f.h / 2 + i * 15}" text-anchor="middle">${esc(l)}</text>`);
    s += '</g>';
  });
  // Zimmer
  ROOMS.forEach(r => {
    const d = state.rooms[r.id];
    const n = d.namen.length;
    const cnt = d.betten ? `${n} von ${d.betten} Betten` : (n ? `${n} Pers.` : '');
    const lineH = 15, top = r.y + 52;
    const maxLines = Math.floor((r.h - 60) / lineH);
    const maxChars = Math.floor((r.w - 14) / 6.6);
    s += `<g class="room edit${selected === r.id ? ' selected' : ''}" data-id="${r.id}" tabindex="0" role="button" aria-label="${esc(r.label)} bearbeiten">`;
    s += `<rect class="box" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${FILL[status(r.id)]}"/>`;
    s += `<text class="title" x="${r.x + 7}" y="${r.y + 18}">${esc(r.label)}</text>`;
    if (cnt) s += `<text class="count" x="${r.x + 7}" y="${r.y + 33}">${cnt}</text>`;
    let shown = d.namen;
    let rest = 0;
    if (n > maxLines) { shown = d.namen.slice(0, maxLines - 1); rest = n - shown.length; }
    shown.forEach((name, i) => {
      const isDup = dup.has(name.trim().toLowerCase());
      s += `<text class="name${isDup ? ' dup' : ''}" x="${r.x + 7}" y="${top + i * lineH}">${esc(cut(name, maxChars))}<title>${esc(name)}</title></text>`;
    });
    if (rest) s += `<text class="more" x="${r.x + 7}" y="${top + shown.length * lineH}">+ ${rest} weitere</text>`;
    s += '</g>';
  });
  const svg = document.getElementById('plan');
  svg.innerHTML = s;
  svg.querySelectorAll('.room.edit').forEach(g => {
    g.addEventListener('click', () => select(g.dataset.id));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(g.dataset.id); } });
  });
}

// ---------- Editor ----------
function select(id) {
  selected = id;
  renderPlan(); renderEditor();
  if (window.matchMedia('(max-width: 900px)').matches) document.getElementById('editor').scrollIntoView({ behavior: 'smooth' });
}
function renderEditor() {
  const el = document.getElementById('editor');
  if (!selected) {
    el.innerHTML = '<h2>Zimmer bearbeiten</h2><p class="leer">Zimmer im Plan oder in der Liste anklicken.</p>';
    return;
  }
  const r = ROOMS.find(x => x.id === selected), d = state.rooms[selected];
  el.innerHTML = `
    <h2>${esc(r.label)}</h2>
    <label for="betten">Anzahl Betten</label>
    <input id="betten" type="number" min="0" max="30" value="${esc(d.betten)}" placeholder="unbekannt">
    <label for="namen">Namen (einer pro Zeile)</label>
    <textarea id="namen" spellcheck="false">${esc(d.namen.join('\n'))}</textarea>
    <div class="hint" id="namehint"></div>
    <div class="warn" id="namewarn"></div>
    <label for="notiz">Notiz</label>
    <textarea id="notiz">${esc(d.notiz)}</textarea>
    <div class="row">
      <button onclick="clearRoom()" class="danger">Zimmer leeren</button>
      <button onclick="selected=null;renderPlan();renderEditor()">Schließen</button>
    </div>`;
  const upd = () => {
    d.betten = el.querySelector('#betten').value;
    d.namen = el.querySelector('#namen').value.split('\n').map(x => x.trim()).filter(Boolean);
    d.notiz = el.querySelector('#notiz').value;
    renderPlan(); renderListe(); renderWarn(); saveSoon();
  };
  el.querySelectorAll('input, textarea').forEach(i => i.addEventListener('input', upd));
  renderWarn();
}
function renderWarn() {
  if (!selected) return;
  const d = state.rooms[selected], dup = duplicates();
  const b = parseInt(d.betten, 10);
  const hint = document.getElementById('namehint'), warn = document.getElementById('namewarn');
  if (!hint) return;
  hint.textContent = `${d.namen.length} Person(en)` + (b ? `, ${b} Betten` : '');
  const msgs = [];
  if (b && d.namen.length > b) msgs.push(`Überbelegt um ${d.namen.length - b}.`);
  const doppelt = d.namen.filter(n => dup.has(n.trim().toLowerCase()));
  if (doppelt.length) msgs.push('Auch in anderem Zimmer eingetragen: ' + [...new Set(doppelt)].join(', '));
  warn.textContent = msgs.join(' ');
}
function clearRoom() {
  if (!selected || !confirm('Alle Einträge in diesem Zimmer löschen? (Bettenanzahl bleibt)')) return;
  const d = state.rooms[selected];
  d.namen = []; d.notiz = '';
  save(); renderAll();
}

// ---------- Liste ----------
function renderListe() {
  let total = 0, betten = 0, bettenBekannt = true;
  const rows = ROOMS.map(r => {
    const d = state.rooms[r.id];
    total += d.namen.length;
    const b = parseInt(d.betten, 10);
    if (b) betten += b; else bettenBekannt = false;
    return `<tr class="clickable" data-id="${r.id}">
      <td><b>${esc(r.label)}</b></td>
      <td>${esc(d.betten || '–')}</td>
      <td>${d.namen.length}</td>
      <td class="namen">${esc(d.namen.join('\n'))}</td>
      <td class="namen">${esc(d.notiz)}</td></tr>`;
  }).join('');
  const tb = document.getElementById('tbody');
  tb.innerHTML = rows;
  tb.querySelectorAll('tr').forEach(tr => tr.addEventListener('click', () => {
    select(tr.dataset.id);
    document.getElementById('planwrap').scrollIntoView({ behavior: 'smooth' });
  }));
  document.getElementById('summe').textContent =
    `Gesamt: ${total} Person(en)` + (bettenBekannt ? ` / ${betten} Betten` : betten ? ` (Betten eingetragen: ${betten}, nicht bei allen Zimmern)` : '');
}

// ---------- Kopf ----------
function renderMeta() {
  ['gruppe', 'von', 'bis'].forEach(k => document.getElementById(k).value = state.meta[k] || '');
  renderPrintHead();
}
function renderPrintHead() {
  const m = state.meta;
  document.getElementById('p-titel').textContent = 'Zimmerbelegung' + (m.gruppe ? ': ' + m.gruppe : '');
  const z = [fmtDate(m.von), fmtDate(m.bis)].filter(Boolean).join(' bis ');
  document.getElementById('p-zeit').textContent = z;
  document.title = 'Zimmerplanung' + (m.gruppe ? ' ' + m.gruppe : '');
}
['gruppe', 'von', 'bis'].forEach(k => document.getElementById(k).addEventListener('input', e => {
  state.meta[k] = e.target.value; renderPrintHead(); saveSoon();
}));

function renderAll() { renderMeta(); renderPlan(); renderEditor(); renderListe(); }

// Änderungen aus anderem Tab übernehmen
window.addEventListener('storage', e => { if (e.key === STORAGE_KEY) { load(); renderAll(); } });

load();
renderAll();
</script>
</body>
</html>
